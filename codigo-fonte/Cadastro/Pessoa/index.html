<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoNexus | Cadastro Pessoa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-animation" aria-hidden="true"></div>

    <main class="container">
        <section class="card">
            <header class="card-header">
                <div>
                    <span class="eyebrow">EcoNexus</span>
                    <h1>Cadastro de Pessoa</h1>
                    <p>Complete seus dados para criar sua conta cidadão com segurança.</p>
                </div>
                <button id="menuBtn" type="button" class="btn btn-ghost">Voltar</button>
            </header>

            <form id="registerForm" class="form-card" novalidate>
                <div class="input-box">
                    <input type="text" id="nome" name="nome" required autocomplete="name" placeholder=" " />
                    <label for="nome">Nome Completo</label>
                </div>

                <div class="input-box">
                    <input type="text" id="usuario" name="usuario" required autocomplete="username" placeholder=" " />
                    <label for="usuario">Nome de Usuário</label>
                </div>

                <div class="input-box">
                    <input type="text" id="cpf" name="cpf" maxlength="14" required autocomplete="off" placeholder=" " />
                    <label for="cpf">CPF</label>
                </div>

                <div class="input-box">
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder=" " />
                    <label for="email">Email</label>
                </div>

                <div class="input-row">
                    <div class="input-box">
                        <input type="text" id="cep" name="cep" maxlength="9" required autocomplete="postal-code" placeholder=" " />
                        <label for="cep">CEP</label>
                    </div>
                    <div class="input-box">
                        <input type="text" id="bairro" name="bairro" required placeholder=" " />
                        <label for="bairro">Bairro</label>
                    </div>
                </div>

                <div class="input-box">
                    <input type="text" id="rua" name="rua" required placeholder=" " />
                    <label for="rua">Rua</label>
                </div>

                <div class="input-row">
                    <div class="input-box">
                        <input type="text" id="numero" name="numero" inputmode="numeric" required placeholder=" " />
                        <label for="numero">Número</label>
                    </div>
                    <div class="input-box">
                        <input type="text" id="ponto_referencia" name="ponto_referencia" placeholder=" " />
                        <label for="ponto_referencia">Ponto de Referência</label>
                    </div>
                </div>

                <div class="input-box password-box">
                    <input type="password" id="senha" name="senha" required autocomplete="new-password" placeholder=" " />
                    <label for="senha">Senha</label>
                    <button type="button" class="toggle-password" data-target="senha" aria-label="Mostrar senha">👁</button>
                </div>

                <div class="input-box password-box">
                    <input type="password" id="confirmarSenha" name="confirmarSenha" required autocomplete="new-password" placeholder=" " />
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <button type="button" class="toggle-password" data-target="confirmarSenha" aria-label="Mostrar senha">👁</button>
                </div>

                <button type="submit" class="btn btn-primary">Criar conta</button>
            </form>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
