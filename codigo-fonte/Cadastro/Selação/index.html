<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoNexus | Seleção de Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="background-animation" aria-hidden="true"></div>

    <main class="container">
        <section class="card">
            <header class="card-header">
                <div>
                    <span class="eyebrow">EcoNexus</span>
                    <h1>Escolha seu cadastro</h1>
                    <p>Selecione o tipo de conta que deseja criar.</p>
                </div>
            </header>

            <div class="cards-grid">
                <article class="option-card" id="pessoaBtn" role="button" tabindex="0">
                    <div class="option-icon">👤</div>
                    <h2>Cidadão</h2>
                    <p>Cadastro para pessoas físicas que desejam usar os serviços EcoNexus.</p>
                    <button type="button" class="btn btn-secondary">Continuar</button>
                </article>

                <article class="option-card" id="empresaBtn" role="button" tabindex="0">
                    <div class="option-icon">🏢</div>
                    <h2>Cooperativa</h2>
                    <p>Cadastro para cooperativas, associações e negócios parceiros.</p>
                    <button type="button" class="btn btn-secondary">Continuar</button>
                </article>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
