<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econexus - Configurações</title>
    <link rel="icon" type="image/x-icon" href="eco_favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --verde-escuro: #004525;
            --verde-claro: #72b850;
            --preto: #000000;
            --branco: #ffffff;
            --cinza-fundo: #f8f9fa;
        }

        * { font-family: "Outfit", sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--cinza-fundo); min-height: 100vh; display: flex; flex-direction: column; }

        main { min-height: 80vh; padding: 40px 0; }

        

                /* Hamburger / Menu Fullscreen */
        .logo-img { width: 50px; height: 50px; object-fit: contain; }
        .hamburger-label svg { width: 30px; height: auto; }
        #menu-toggle { display: none; }
        .hamburger-label { cursor: pointer; z-index: 1001; padding: 10px; }
        .user-link { padding: 8px 20px; border-radius: 50px; background: white; color: black; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .full-screen-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--verde-claro); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; visibility: hidden; z-index: 1000; }
        #menu-toggle:checked ~ .full-screen-menu { opacity: 1; visibility: visible; }
        .full-screen-menu .nav-link { font-size: 2.2rem; color: white; margin: 10px 0; padding: 10px 40px; border-radius: 12px; background: rgba(0,0,0,0.2); transition: 0.3s; text-decoration: none; }
        .full-screen-menu .nav-link:hover { transform: scale(1.05); background: rgba(0,0,0,0.4); }
        body:has(#menu-toggle:checked) { overflow: hidden; }

        /* Botões de Configuração */
        .config-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

        .btn-config {
            background: white;
            color: var(--preto);
            padding: 18px 25px;
            font-size: 1.1rem;
            border-radius: 15px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            text-decoration: none;
            font-weight: 500;
            width: 100%;
        }
        .btn-config:hover {
            border-color: var(--verde-escuro);
            transform: translateX(5px);
            color: var(--verde-escuro);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .btn-logout {
            margin-top: 20px;
            background: #fff0f0;
            color: #d9534f;
            border: 1px solid #f5c6cb;
        }
        .btn-logout:hover {
            background: #d9534f;
            color: white;
            border-color: #d9534f;
        }

        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .overlay-card {
            background: white; padding: 35px; border-radius: 25px;
            width: 90%; max-width: 500px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .btn-close-modal {
            position: absolute; top: 15px; right: 20px;
            font-size: 1.5rem; cursor: pointer; color: #999;
        }

        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--verde-claro); }
        input:checked + .slider:before { transform: translateX(26px); }

        footer { background-color: var(--preto); color: var(--branco); text-align: center; padding: 20px 0; font-size: 0.9rem; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar bg-black py-3">
            <div class="container">
                <label for="menu-toggle" class="hamburger-label">
                    <svg fill="white" width="30" viewBox="0 0 14 14"><path d="M2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/></svg>
                </label>
                <a class="navbar-brand m-0" href="index.html">
                    <img src="econexus_logo.png" alt="Logo Econexus" class="logo-img">
                </a>
                <a href="#" class="user-link" id="navUserName">Cidadão</a>
                <input type="checkbox" id="menu-toggle">
                <div class="full-screen-menu">
                    <ul class="nav flex-column text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="dashboard_cidadao.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                        <li class="nav-item"><a class="nav-link" href="pontos.html">Pontos de Coleta</a></li>
                        <li class="nav-item"><a class="nav-link" href="configuracoes.html">Configurações</a></li>
                        <li class="nav-item mt-5">
                            <label for="menu-toggle" class="btn btn-outline-light rounded-pill px-4">Fechar</label>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="text-center mb-5">
                <h1 class="fw-bold" style="color: var(--preto);">Configurações</h1>
                <p class="text-secondary">Gerencie seus dados e preferências da conta.</p>
            </div>

            <div class="config-container">
                <button class="btn-config" onclick="abrirModal('pessoal')">
                    <span><i class="bi bi-person-circle me-3"></i>Informações Pessoais</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config" onclick="abrirModal('endereco')">
                    <span><i class="bi bi-geo-alt-fill me-3"></i>Meu Endereço</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config" onclick="abrirModal('notificacoes')">
                    <span><i class="bi bi-bell-fill me-3"></i>Notificações</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config" onclick="alert('Suporte Econexus: suporte@econexus.com')">
                    <span><i class="bi bi-headset me-3"></i>Suporte e Ajuda</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config btn-logout" onclick="logout()">
                    <span><i class="bi bi-box-arrow-right me-3"></i>Sair da Conta</span>
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="m-0 opacity-75">&copy; 2026 Econexus. Sustentabilidade e transparência de ponta a ponta.</p>
        </div>
    </footer>

    <div id="modalOverlay" class="overlay">
        <div class="overlay-card">
            <span class="btn-close-modal" onclick="fecharModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // ── Guard de sessão ───────────────────────────────────────────────────────
        if (!localStorage.getItem('usuarioLogado')) { window.location.href = 'login.html'; }

         let usuarioLogado = null;

        function obterUsuario() {
            const dadosSession = localStorage.getItem('usuarioLogado');
            if (dadosSession) {
                usuarioLogado = JSON.parse(dadosSession);
                document.getElementById('navUserName').innerText = usuarioLogado.nome.split(' ')[0];
            } else {
                window.location.href = 'login.html';
            }
        }

        // FUNÇÃO DE NOTIFICAÇÃO TESTE
        function testarPush(checkbox) {
            if (checkbox.checked) {
                // Solicita permissão se ainda não tiver
                if (Notification.permission !== "granted") {
                    Notification.requestPermission();
                }

                setTimeout(() => {
                    // Verifica se o checkbox ainda está ativo após os 5 segundos
                    if (checkbox.checked) {
                        if (Notification.permission === "granted") {
                            new Notification("Econexus", {
                                body: "suas notificações foram ativadas",
                                icon: "eco_favicon.png"
                            });
                        } else {
                            // Fallback caso as notificações do sistema estejam bloqueadas pelo navegador
                            alert("Notificação Econexus: suas notificações foram ativadas");
                        }
                    }
                }, 5000);
            }
        }

        function abrirModal(tipo) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.style.display = 'flex';
            content.innerHTML = "";

            if (tipo === 'pessoal') {
                const labelNome = usuarioLogado.tipo === 'cooperativa' ? 'Razão Social' : 'Nome';
                content.innerHTML = `
                    <h3 class="fw-bold mb-4">Dados da Conta</h3>
                    <p class="mb-2 text-secondary"><strong>Tipo:</strong> ${usuarioLogado.tipo.toUpperCase()}</p>
                    <p class="mb-2"><strong>${labelNome}:</strong> ${usuarioLogado.nome}</p>
                    <p class="mb-2"><strong>Documento:</strong> ${usuarioLogado.documento}</p>
                    <p class="mb-4"><strong>Email:</strong> ${usuarioLogado.email}</p>
                    <button class="btn btn-dark w-100 rounded-pill" onclick="fecharModal()">Ok</button>
                `;
            } 
            else if (tipo === 'endereco') {
                renderEndereco(false);
            }
            else if (tipo === 'notificacoes') {
                content.innerHTML = `
                    <h3 class="fw-bold mb-4">Notificações</h3>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span>Alertas de Coleta Próxima</span>
                        <label class="switch">
                            <input type="checkbox" onchange="testarPush(this)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span>Novidades da Comunidade</span>
                        <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                    </div>
                    <button class="btn btn-success w-100 rounded-pill" style="background: var(--verde-claro); border:none;" onclick="fecharModal()">Salvar</button>
                `;
            }
        }

        function renderEndereco(editando) {
            const content = document.getElementById('modalContent');
            if (!editando) {
                content.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold m-0">Endereço</h3>
                        <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="renderEndereco(true)">Editar</button>
                    </div>
                    <p><strong>Rua:</strong> ${usuarioLogado.rua}, ${usuarioLogado.numero}</p>
                    <p><strong>Bairro:</strong> ${usuarioLogado.bairro}</p>
                    <p class="mb-4"><strong>CEP:</strong> ${usuarioLogado.cep}</p>
                    <button class="btn btn-dark w-100 rounded-pill" onclick="fecharModal()">Fechar</button>
                `;
            } else {
                content.innerHTML = `
                    <h3 class="fw-bold mb-4">Editar Endereço</h3>
                    <input type="text" id="editRua" class="form-control mb-2 rounded-3" value="${usuarioLogado.rua}" placeholder="Rua">
                    <input type="text" id="editNum" class="form-control mb-2 rounded-3" value="${usuarioLogado.numero}" placeholder="Número">
                    <input type="text" id="editBairro" class="form-control mb-3 rounded-3" value="${usuarioLogado.bairro}" placeholder="Bairro">
                    <button class="btn btn-success w-100 rounded-pill mb-2" style="background: var(--verde-claro); border:none;" onclick="salvarEndereco()">Salvar Alterações</button>
                    <button class="btn btn-light w-100 rounded-pill" onclick="renderEndereco(false)">Cancelar</button>
                `;
            }
        }

        function salvarEndereco() {
            usuarioLogado.rua = document.getElementById('editRua').value;
            usuarioLogado.numero = document.getElementById('editNum').value;
            usuarioLogado.bairro = document.getElementById('editBairro').value;
            localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
            alert("Endereço atualizado!");
            renderEndereco(false);
        }

        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'login.html';
        }

        function fecharModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        window.onclick = function(event) {
            if (event.target == document.getElementById('modalOverlay')) fecharModal();
        }

        window.onload = obterUsuario;
    </script>
</body>
</html>
