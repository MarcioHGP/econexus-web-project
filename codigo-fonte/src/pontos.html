<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoNexus - Pontos de Coleta</title>
    <link rel="icon" type="image/x-icon" href="eco_favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --verde-escuro: #004525;
            --verde-claro: #72b850;
            --preto: #000000;
            --branco: #ffffff;
            --cinza-fundo: #f8f9fa;
        }

        * { font-family: "Outfit", sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--cinza-fundo); min-height: 100vh; display: flex; flex-direction: column; }

        

                /* Hamburger / Menu Fullscreen */
        .logo-img { width: 50px; height: 50px; object-fit: contain; }
        svg { width: 30px; height: auto; }
        #menu-toggle { display: none; }
        .hamburger-label { cursor: pointer; z-index: 1001; padding: 10px; }
        .user-link { padding: 8px 20px; border-radius: 50px; background: white; color: black; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .full-screen-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--verde-claro); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; visibility: hidden; z-index: 1000; }
        #menu-toggle:checked ~ .full-screen-menu { opacity: 1; visibility: visible; }
        .full-screen-menu .nav-link { font-size: 2.2rem; color: white; margin: 10px 0; padding: 10px 40px; border-radius: 12px; background: rgba(0,0,0,0.2); transition: 0.3s; text-decoration: none; }
        .full-screen-menu .nav-link:hover { transform: scale(1.05); background: rgba(0,0,0,0.4); }
        body:has(#menu-toggle:checked) { overflow: hidden; }

        /* Design unificado com base na index.html / login.html */
        .card-custom {
            background: var(--branco);
            border: 1px solid var(--preto);
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }
        .card-custom:hover {
            transform: translateY(-4px);
            box-shadow: 5px 10px 20px rgba(0, 0, 0, 0.2);
        }

        .card-custom h5 {
            color: var(--verde-escuro);
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 15px;
            position: relative;
            padding-bottom: 8px;
        }
        .card-custom h5::after {
            content: ''; position: absolute; left: 0; bottom: 0; width: 35px; height: 3px; background-color: var(--verde-claro); border-radius: 2px;
        }

        .badge-bairro {
            background-color: var(--preto); color: var(--branco); font-weight: 600; padding: 5px 14px; border-radius: 30px; font-size: 0.75rem; display: inline-block; margin-bottom: 15px; text-transform: uppercase;
        }

        .badge-material {
            background-color: rgba(114, 184, 80, 0.12); color: var(--verde-escuro); font-weight: 600; font-size: 0.78rem; padding: 4px 10px; border-radius: 6px; margin-right: 4px; margin-bottom: 6px; display: inline-block;
        }

        /* Botões de Ação */
        .btn-action {
            background-color: var(--verde-escuro); color: var(--branco); width: 100%; border: none; padding: 12px; border-radius: 10px; font-weight: 700; text-decoration: none; text-align: center; display: block; margin-top: auto; transition: 0.2s;
        }
        .btn-action:hover { background-color: var(--verde-claro); color: var(--preto); }

        .btn-maps {
            background-color: #25d366; color: var(--preto); width: 100%; border: 1px solid var(--preto); padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; text-align: center; display: block; box-shadow: 4px 4px 0px var(--preto); transition: 0.2s;
        }
        .btn-maps:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--preto); color: var(--preto); }

        .map-placeholder {
            background-color: #e5e3df; border: 1px solid var(--preto); border-radius: 20px; height: 260px; display: flex; align-items: center; justify-content: center; color: #555; font-weight: 600; box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1);
        }

        footer { background-color: var(--preto); color: var(--branco); text-align: center; padding: 20px 0; font-size: 0.9rem; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <nav class="navbar bg-black py-3">
            <div class="container">
                <label for="menu-toggle" class="hamburger-label">
                    <svg fill="white" width="30" viewBox="0 0 14 14"><path d="M2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/></svg>
                </label>
                <a class="navbar-brand m-0" href="index.html">
                    <img src="econexus_logo.png" alt="Logo Econexus" class="logo-img">
                </a>
                <a href="#" class="user-link" id="navUserName">Cidadão</a>
                <input type="checkbox" id="menu-toggle">
                <div class="full-screen-menu">
                    <ul class="nav flex-column text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="dashboard_cidadao.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                        <li class="nav-item"><a class="nav-link" href="pontos.html">Pontos de Coleta</a></li>
                        <li class="nav-item"><a class="nav-link" href="configuracoes.html">Configurações</a></li>
                        <li class="nav-item mt-5">
                            <label for="menu-toggle" class="btn btn-outline-light rounded-pill px-4">Fechar</label>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        
        <div id="visaoLista" style="display: none;">
            <div class="row mb-5 align-items-center">
                <div class="col-md-7">
                    <h2 class="fw-bold text-dark m-0">Pontos de Coleta Cadastrados</h2>
                    <p class="text-secondary m-0">Consulte a lista completa das cooperativas e pontos de recolha de BH.</p>
                </div>
                <div class="col-md-4 ms-auto mt-3 mt-md-0">
                    <select id="filtroBairroLista" class="form-select border-dark" onchange="renderizarListaCompleta()">
                        <option value="">Todos os bairros</option>
                        </select>
                </div>
            </div>
            <div class="row g-4" id="gridCardsCompleto">
                </div>
        </div>

        <div id="visaoDetalhada" style="display: none;" class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-custom" id="conteudoPontoUnico">
                    </div>
            </div>
        </div>

    </main>

        <footer class="bg-black text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="m-0 opacity-75">&copy; 2026 Econexus. Sustentabilidade e transparência de ponta a ponta.</p>
        </div>
    </footer>

    <script>
        // Array com todos os 25 pontos sincronizados
        const pontosColeta = [
            { id: 1, bairro: "BARREIRO DE BAIXO", endereco: "Rua Vicente de Azevedo, 301 - Gelu Barreiro", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 17h, Sáb: 8h às 12h" },
            { id: 2, bairro: "CONJUNTO TÚNEL DE IBIRITÉ", endereco: "Rua Marly Passos, 10 - URPV Túnel", materiais: ["Vidro"], horario: "Seg a Sex: 7h às 18h, Sáb e Dom: 7h40 às 16h" },
            { id: 3, bairro: "LINDEIA", endereco: "Rua Antônio de Souza Gomes, 110 - URPV Lindeia", materiais: ["Vidro"], horario: "Seg a Sex: 7h às 18h, Sáb e Dom: 7h40 às 16h" },
            { id: 4, bairro: "MIRAMAR", endereco: "Av. Olinto Meireles - Praça José Verano da Silva", materiais: ["Vidro"], horario: "24 horas" },
            { id: 5, bairro: "CENTRO", endereco: "Av. Afonso Pena, 1.377 - Parque Municipal", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Ter a Sáb: 7h às 20h30, Dom: 7h às 16h30" },
            { id: 6, bairro: "CENTRO", endereco: "Av. dos Andradas, 787 - Parque Municipal", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Ter a Sáb: 7h às 20h30, Dom: 7h às 16h30" },
            { id: 7, bairro: "FUNCIONÁRIOS", endereco: "Av. Getúlio Vargas, 20 (Esq. Contorno)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 8, bairro: "FUNCIONÁRIOS", endereco: "Rua dos Aimorés (Esq. Alagoas)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 9, bairro: "FUNCIONÁRIOS", endereco: "Rua dos Timbiras (Esq. Afonso Pena)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 10, bairro: "SANTA LÚCIA", endereco: "Av. Arthur Bernardes, 3.951", materiais: ["Vidro"], horario: "24 horas" },
            { id: 11, bairro: "SANTO ANTÔNIO", endereco: "Av. Prudente de Morais (Esq. Joaquim Murtinho)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 12, bairro: "SÃO BENTO", endereco: "Av. Raja Gabáglia, 2.671 (Estac. Porcão)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 13, bairro: "SÃO BENTO", endereco: "Av. Raja Gabáglia, 3.385 (Raja Grill)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 14, bairro: "SAVASSI", endereco: "Av. Getúlio Vargas (Esq. Inconfidentes)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 15, bairro: "CASA BRANCA", endereco: "Av. dos Andradas, 8.255 - URPV Copasa", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 18h, Sáb e Dom: 7h40 às 16h" },
            { id: 16, bairro: "FLORESTA", endereco: "Praça Comendador Negrão de Lima", materiais: ["Vidro"], horario: "24 horas" },
            { id: 17, bairro: "FLORESTA", endereco: "Rua Sapucaí (Esq. Assis Chateaubriand)", materiais: ["Vidro"], horario: "24 horas" },
            { id: 18, bairro: "HORTO FLORESTAL", endereco: "Av. dos Andradas, 5.965 - URPV Andradas", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 18h, Sáb e Dom: 7h40 às 16h" },
            { id: 19, bairro: "HORTO FLORESTAL", endereco: "Rua Santo Agostinho, 1.717 (Senai)", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 21h" },
            { id: 20, bairro: "EYMARD", endereco: "Rua Lídia (Parque Guilherme Lage)", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "24 horas" },
            { id: 21, bairro: "IPIRANGA", endereco: "Rua Princesa Leopoldina, 485 - Gelu Nordeste", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 17h, Sáb: 8h às 12h" },
            { id: 22, bairro: "SÃO BERNARDO", endereco: "Av. Washington Luiz, 941 - URPV Aeroporto", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 18h, Sáb e Dom: 7h40 às 16h" },
            { id: 23, bairro: "SALGADO FILHO", endereco: "Rua Conselheiro Pires da Mota, 205 - Gelu Oeste", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 17h, Sáb: 8h às 12h" },
            { id: 24, bairro: "ZOOLÓGICO", endereco: "Diversos pontos internos (Aquário/Administração)", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Ter a Dom: 8h às 16h" },
            { id: 25, bairro: "RIO BRANCO", endereco: "Rua Augusto dos Anjos, 1.983 - URPV Rio Branco", materiais: ["Papel", "Metal", "Plástico", "Isopor", "Vidro"], horario: "Seg a Sex: 7h às 18h, Sáb e Dom: 7h40 às 16h" }
        ];

        // Mescla pontos fixos com os extras cadastrados pelas cooperativas
        function obterTodosPontos() {
            const extras = JSON.parse(localStorage.getItem('pontosExtras') || '[]');
            return [...pontosColeta, ...extras];
        }

        // Configura dinamicamente o select da lista com bairros únicos
        function configurarFiltroLista() {
            const selectLista = document.getElementById('filtroBairroLista');
            const todos = obterTodosPontos();
            const bairrosUnicos = [...new Set(todos.map(p => p.bairro))].sort();
            selectLista.innerHTML = '<option value="">Todos os bairros</option>';
            bairrosUnicos.forEach(bairro => {
                const option = document.createElement('option');
                option.value = bairro;
                option.textContent = bairro;
                selectLista.appendChild(option);
            });
        }

        function carregarPagina() {
            configurarFiltroLista();
            const params = new URLSearchParams(window.location.search);
            const pontoId = params.get('id');

            if (pontoId) {
                document.getElementById('visaoDetalhada').style.display = 'flex';
                const todos = obterTodosPontos();
                const ponto = todos.find(p => p.id == pontoId);
                
                if (ponto) {
                    const isExtra = ponto.id >= 1000;
                    document.getElementById('conteudoPontoUnico').innerHTML = `
                        <div class="mb-2">
                            <span class="badge-bairro">${ponto.bairro}</span>
                            ${isExtra ? '<span class="badge bg-success ms-2" style="font-size:0.7rem;">Cadastrado por Cooperativa</span>' : ''}
                        </div>
                        <h4 class="fw-bold text-dark mb-4">${ponto.endereco}</h4>
                        
                        <div class="map-placeholder mb-4">
                            <div class="text-center">
                                <i class="bi bi-geo-alt-fill fs-2 text-danger d-block mb-2"></i>
                                ${ponto.coords ? `Coordenadas: ${ponto.coords[0].toFixed(4)}, ${ponto.coords[1].toFixed(4)}` : 'Coordenadas carregadas com sucesso via Dashboard'}
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <h6 class="fw-bold text-secondary mb-1"><i class="bi bi-clock me-2"></i>Funcionamento:</h6>
                                <p class="text-dark fw-semibold small">${ponto.horario}</p>
                            </div>
                            <div class="col-sm-6">
                                <h6 class="fw-bold text-secondary mb-2">Materiais Aceitos:</h6>
                                <div>${ponto.materiais.map(m => `<span class="badge-material">${m}</span>`).join('')}</div>
                            </div>
                            ${isExtra && ponto.cooperativa ? `
                            <div class="col-12">
                                <h6 class="fw-bold text-secondary mb-1"><i class="bi bi-building me-2"></i>Cooperativa Responsável:</h6>
                                <p class="text-dark fw-semibold small">${ponto.cooperativa}</p>
                            </div>` : ''}
                        </div>

                        <button class="btn-maps" onclick="abrirRota('${ponto.endereco}')">
                            <i class="bi bi-signpost-2-fill me-2"></i>Traçar Rota no Google Maps
                        </button>
                    `;
                }
            } else {
                document.getElementById('visaoLista').style.display = 'block';
                renderizarListaCompleta();
            }
        }

        function renderizarListaCompleta() {
            const filtroBairro = document.getElementById('filtroBairroLista').value;
            const container = document.getElementById('gridCardsCompleto');
            container.innerHTML = "";

            const todos = obterTodosPontos();
            const filtrados = todos.filter(p => filtroBairro === "" || p.bairro === filtroBairro);

            filtrados.forEach(ponto => {
                const isExtra = ponto.id >= 1000;
                container.innerHTML += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card-custom">
                            <div>
                                <span class="badge-bairro">${ponto.bairro}</span>
                                ${isExtra ? '<span class="badge bg-success ms-1" style="font-size:0.65rem; vertical-align:middle;">Novo</span>' : ''}
                            </div>
                            <h5>Ecoponto${isExtra && ponto.cooperativa ? ` <small class="text-secondary fw-normal" style="font-size:0.7rem;">· ${ponto.cooperativa}</small>` : ''}</h5>
                            <p class="text-dark fw-semibold small mb-2" style="min-height:44px;">${ponto.endereco}</p>
                            <p class="small text-secondary mb-3"><i class="bi bi-clock me-1 text-success"></i> ${ponto.horario}</p>
                            <div class="mb-4">
                                ${ponto.materiais.map(m => `<span class="badge-material">${m}</span>`).join('')}
                            </div>
                            <a href="pontos.html?id=${ponto.id}" class="btn-action">Ver Detalhes Expandidos</a>
                        </div>
                    </div>
                `;
            });

            if (filtrados.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-secondary py-5">
                    <i class="bi bi-geo-alt fs-2 d-block mb-2 opacity-50"></i>
                    Nenhum ponto encontrado para o bairro selecionado.
                </div>`;
            }
        }

        function abrirRota(endereco) {
            const query = encodeURIComponent(endereco + " Belo Horizonte MG");
            window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
        }

        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('usuarioLogado'));
            if (user) document.getElementById('navUserName').innerText = user.nome.split(' ')[0];
            carregarPagina();
        };
    </script>
</body>
</html>
