<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econexus - Login</title>
    <link rel="icon" type="image/x-icon" href="econexus_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<style>
    .login-container {
        border: 1px solid black;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 400px;
    }

    .login {   
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        height: 80vh;
    }

    .login input {
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 10px 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
        margin: 5px auto 15px auto;
    }

    .login button {
        background-color: #004525;
        color: white;
        width: 100%;
        border: none;
        padding: 12px;
        margin: 10px 0;
        border-radius: 5px;
        transition: 0.3s ease-in-out;
        font-weight: bold;
    }

    .login button:hover {
        background-color: #72b850;
    }

    /* Estilo para os botões de seleção de tipo */
    .btn-group-toggle {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .btn-check:checked + .btn-outline-success {
        background-color: #004525;
        color: white;
    }

    .link {
        text-align: center;
        margin-top: 10px;
    }

        /* Padronização visual baseada em login.html e cadastro.html */
        :root {
            --verde-escuro: #004525;
            --verde-claro: #72b850;
            --preto: #000000;
            --branco: #ffffff;
        }
        .full-screen-menu {
            background: var(--verde-escuro) !important;
        }

        .full-screen-menu .nav-link {
            background: var(--preto) !important;
            color: var(--branco) !important;
            border: 1px solid var(--branco) !important;
            border-radius: 20px !important;
            font-weight: 700 !important;
        }

        .full-screen-menu .nav-link:hover {
            background: var(--verde-claro) !important;
            color: var(--preto) !important;
            border-color: var(--preto) !important;
        }

        .card-custom,
        .metric-card,
        .card-impacto,
        .table-container,
        .card-metrica,
        .tabela-historico,
        .info-card,
        .registration-container,
        .config-container .btn-config,
        .overlay-card,
        .anuncio-card,
        .modal-box {
            border: 1px solid var(--preto) !important;
            border-radius: 20px !important;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15) !important;
        }

        input,
        textarea,
        select,
        .form-control,
        .form-select,
        .input-custom,
        .input-pedido,
        .select-coop,
        .textarea-avaliacao,
        .form-select-custom {
            border-radius: 5px !important;
        }

        .btn,
        .btn-register,
        .btn-submit-login,
        .btn-view-all,
        .btn-forum,
        .btn-avaliar,
        .btn-pedir-coleta,
        .btn-action,
        .btn-maps,
        .btn-publicar,
        .btn-interesse,
        .btn-submit-form,
        .btn-eco,
        .btn-table-action {
            border-radius: 5px !important;
        }

        .btn-register,
        .btn-submit-login,
        .btn-view-all,
        .btn-avaliar,
        .btn-pedir-coleta,
        .btn-action,
        .btn-maps,
        .btn-publicar,
        .btn-interesse,
        .btn-submit-form,
        .btn-eco,
        .btn-table-action {
            background-color: var(--verde-escuro) !important;
            color: var(--branco) !important;
            border: none !important;
            transition: 0.3s ease-in-out !important;
            font-weight: 700 !important;
        }

        .btn-register:hover,
        .btn-submit-login:hover,
        .btn-view-all:hover,
        .btn-avaliar:hover,
        .btn-pedir-coleta:hover,
        .btn-action:hover,
        .btn-maps:hover,
        .btn-publicar:hover,
        .btn-interesse:hover,
        .btn-submit-form:hover,
        .btn-eco:hover,
        .btn-table-action:hover {
            background-color: var(--verde-claro) !important;
            color: var(--preto) !important;
        }


        .btn-success,
        .btn-primary {
            background-color: var(--verde-escuro) !important;
            border-color: var(--verde-escuro) !important;
            color: var(--branco) !important;
        }

        .btn-success:hover,
        .btn-primary:hover {
            background-color: var(--verde-claro) !important;
            border-color: var(--verde-claro) !important;
            color: var(--preto) !important;
        }

        .btn-outline-primary,
        .btn-outline-secondary {
            border-color: var(--verde-escuro) !important;
            color: var(--verde-escuro) !important;
            background-color: var(--branco) !important;
        }

        .btn-outline-primary:hover,
        .btn-outline-secondary:hover {
            background-color: var(--verde-escuro) !important;
            color: var(--branco) !important;
        }        .btn-outline-success {
            color: var(--verde-escuro) !important;
            border-color: var(--verde-escuro) !important;
            border-radius: 5px !important;
            font-weight: 600 !important;
        }

        .btn-check:checked + .btn-outline-success {
            background-color: var(--verde-escuro) !important;
            border-color: var(--verde-escuro) !important;
            color: var(--branco) !important;
        }</style>
<body>

    <main>
        <nav class="navbar navbar-black bg-black">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="econexus_logo.png" alt="Logo Econexus" style="height: 40px;">
                </a>
            </div>
        </nav>

        <div class="login">
            <div class="login-container">
                <h2 class="text-center mb-4">Acessar Conta</h2>
                
                <form id="formLogin">
                    <label class="d-block text-center mb-2">Entrar como:</label>
                    <div class="btn-group-toggle mb-4" role="group">
                        <input type="radio" class="btn-check" name="tipoLogin" id="tipoCidadao" value="cidadao" checked>
                        <label class="btn btn-outline-success w-100" for="tipoCidadao">Cidadão</label>

                        <input type="radio" class="btn-check" name="tipoLogin" id="tipoCooperativa" value="cooperativa">
                        <label class="btn btn-outline-success w-100" for="tipoCooperativa">Cooperativa</label>
                    </div>

                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                    
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                    
                    <button type="submit">Entrar</button>
                </form>

                <div class="link">
                    Novo por aqui? <a href="cadastro.html">Cadastre-se.</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Econexus. Todos os direitos reservados.</p>
        </div>
    </footer>

<script>
    document.getElementById('formLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const tipoSelecionado = document.querySelector('input[name="tipoLogin"]:checked').value;

        // Recupera os usuários do LocalStorage
        const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
        
        // Procura um usuário que coincida com e-mail, senha E tipo de conta
        const usuario = usuarios.find(u => 
            u.email === email && 
            u.senha === senha && 
            u.tipo === tipoSelecionado
        );

                    
            if (usuario) {
                localStorage.setItem('usuarioLogado', JSON.stringify(usuario));
                const saudacao = tipoSelecionado === 'cidadao' ? 'Bem-vindo, ' : 'Olá, Cooperativa ';
                alert('Login realizado! ' + saudacao + usuario.nome);
                
                // Redirecionamento correto para as novas telas separadas
                if (tipoSelecionado === 'cidadao') {
                    window.location.href = 'dashboard_cidadao.html';
                } else {
                    window.location.href = 'dashboard_cooperativa.html';
                }
            } else {
            // Verifica se o erro foi o tipo de conta (ex: tentou logar como cidadão mas é cooperativa)
            const erroTipo = usuarios.find(u => u.email === email && u.senha === senha && u.tipo !== tipoSelecionado);
            
            if (erroTipo) {
                alert('E-mail e senha corretos, mas este cadastro é de uma ' + (erroTipo.tipo === 'cidadao' ? 'conta de Cidadão.' : 'Cooperativa.'));
            } else {
                alert('E-mail ou senha inválidos.');
            }
        }
    });
</script>
</body>
</html>
