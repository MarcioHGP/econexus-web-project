        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
        * { font-family: "Outfit", sans-serif; box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            margin: 0;
            background: #f4f4f7;
        }
        
        /* Layout Flexbox estrutural */
        body {
            display: flex;
            flex-direction: column;

        }
        
        /* A main vai ocupar o espaço inteiro e empurrar o footer */

        .full-screen-menu {
            position: fixed;

            background: #72b850;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.3s ease;
            opacity: 0;
            visibility: hidden;
            z-index: 1000;
        }

        #menu-toggle:checked ~ .full-screen-menu { opacity: 1; visibility: visible; }

        .full-screen-menu .nav-link {
            font-size: 2rem;
            color: white;
            margin: 15px 0;
            border-radius: 8px;
            background: black;
            transition: 0.3s ease-in-out;

        body:has(#menu-toggle:checked) { overflow: hidden; }

        /* Barra de pesquisa */
        .search-bar {

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

        /* Carrossel de imagens */
        .carousel-viewport {
            position: relative;
            width: 100%;
            max-width: 90rem; 
            overflow: hidden;
            padding: 20px 0;
            height: auto;
            margin: 0 auto;
        }

        .carousel-track {
            display: flex;
            gap: 20px; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            padding-left: 15%; 
        }

        .carousel-slide {
            flex: 0 0 70%; 
            height: 30rem;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            opacity: 0.6; 
            transition: opacity 0.4s;

        .carousel-slide.active { opacity: 1; }

        .carousel-btn {

            top: 50%;

            #aba-post {

            border-color: #000000;

            .guia-post-card {

            }

                color: #000000;

            </style>

    <script>
                const track = document.getElementById('track');
        const slides = document.querySelectorAll('.carousel-slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentIndex = 0;

        function updateCarousel() {
            // 1. Remove a classe ativa de todos e adiciona só no atual
            slides.forEach((slide, index) => {
                if (index === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            // 2. Calcula o deslocamento exato baseado na largura do slide + o gap (espaçamento)
            const slideWidth = slides[0].getBoundingClientRect().width;
            const gap = 20; // Deve ser idêntico ao 'gap' definido no CSS (.carousel-track)
            
            // O cálculo move a "pista" para trás de acordo com o índice atual
            const amountToMove = currentIndex * (slideWidth + gap);
            
            track.style.transform = `translateX(-${amountToMove}px)`;
        }

        // Evento para avançar
        nextBtn.addEventListener('click', () => {
            if (currentIndex < slides.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0; // Volta para o início se quiser fazer loop
            }
            updateCarousel();
        });

        // Evento para voltar
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = slides.length - 1; // Vai para o fim
            }
            updateCarousel();
        });

        // Inicializa o carrossel na posição correta
        window.addEventListener('resize', updateCarousel);


        //CRIAÇÃO DO POST
        
        //ABRE FECHA
        
        // Abre a aba mudando o display para flex
        function abrirCaixinha() {
        document.getElementById('aba-post').style.display = 'flex';
        }
        // Fecha a aba mudando o display de volta para none
        function fecharCaixinha() {
        document.getElementById('aba-post').style.display = 'none';
        }
        
        //ENTRADA DE DADOS

function salvarNovoPost() {
    const campoTitulo = document.getElementById('titulo-pub');
    const campoTipo = document.getElementById('tipo-pub');
    const campoConteudo = document.getElementById('conteudo-pub');
    const campoImagem = document.getElementById('imagem-pub'); // Pega o input do arquivo

    const tituloTexto = campoTitulo.value.trim();
    const tipoSelecionado = campoTipo.value;
    const conteudoTexto = campoConteudo.value.trim();
    const arquivo = campoImagem.files[0]; // Pega o arquivo de imagem selecionado

    if (tituloTexto === "" || conteudoTexto === "") {
        alert("Por favor, preencha o título e o conteúdo do post!");
        return;
    }

    // Função interna para ler a imagem e transformá-la em string Base64
    const lerImagem = new Promise((resolve) => {
        if (!arquivo) {
            resolve(null); // Se não escolheu imagem, avança como nulo
            return;
        }
        const reader = new FileReader();
        reader.onloadend = function() {
            resolve(reader.result); // Retorna a imagem convertida em texto
        };
        reader.readAsDataURL(arquivo);
    });

    // Executa a leitura e depois salva no banco
    lerImagem.then((imagemBase64) => {
        const postsNoBanco = JSON.parse(localStorage.getItem('postsForum')) || [];

        const novoPost = {
            id: Date.now(), 
            titulo: tituloTexto,
            tipo: tipoSelecionado,
            conteudo: conteudoTexto,
            imagem: imagemBase64 // Guarda a string da imagem aqui!
        };

        postsNoBanco.unshift(novoPost);
        localStorage.setItem('postsForum', JSON.stringify(postsNoBanco));

        // Limpa os campos
        campoTitulo.value = "";
        campoConteudo.value = "";
        campoImagem.value = ""; // Limpa o arquivo selecionado
        campoTipo.value = "artigo";

        fecharCaixinha();
        mostrarPostsNaTela();
    });

        // ATUALIZAR POSTS
        mostrarPostsNaTela();
        }

        //GUIA DOS POSTS

        window.onload = function() {
        mostrarPostsNaTela();
        };

        function mostrarPostsNaTela() {
            const container = document.getElementById('container-posts');
            
            // SE NÃO ENCONTRA DIV ERRO
            if (!container) return; 

            // BUSCA POSTS
            const postsSalvos = JSON.parse(localStorage.getItem('postsForum')) || [];

            // IF NÃO HÁ POSTS
            if (postsSalvos.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#6c757d;'>Nenhum tópico criado ainda. Seja o primeiro!</p>";
                return;
            }

            // LIMPA O CONTAINER PARA NÃO DUPLICAR
            container.innerHTML = "";

            // CONFERE LISTA DE POSTS
            postsSalvos.forEach(post => {
                // FORMATA O CARD
                const tagClasse = post.tipo === 'artigo' ? 'tag-artigo' : 'tag-doacao';
                const tagTexto = post.tipo === 'artigo' ? 'Artigo' : 'Doação';

                // MONTA O HTML DO POST
                const cardHTML = `
                    <a href="modelpost.html?id=${post.id}" class="guia-post-link">
                        <div class="guia-post-card">
                            <div class="guia-post-info">
                                <span class="tag-tipo ${tagClasse}">${tagTexto}</span>
                                <h3 class="guia-post-titulo">${post.titulo}</h3>
                                <p class="guia-post-previa">${post.conteudo.substring(0, 100)}...</p>
                            </div>
                            <div class="guia-post-seta">
                                <i class="fas fa-chevron-right"></i> </div>
                        </div>
                    </a>
                `;

                // INJETA O HTML MONTADO NO CARD
                container.innerHTML += cardHTML;
            });
        };
        window.onload = function() {
            mostrarPostsNaTela();
        };

        function mostrarPostsNaTela() {
            const container = document.getElementById('container-posts');
            if (!container) return; 

            const postsSalvos = JSON.parse(localStorage.getItem('postsForum')) || [];

            if (postsSalvos.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#6c757d;'>Nenhum tópico criado ainda. Seja o primeiro!</p>";
                return;
            }

            container.innerHTML = "";

            postsSalvos.forEach(post => {
                const tagClasse = post.tipo === 'artigo' ? 'tag-artigo' : 'tag-doacao';
                const tagTexto = post.tipo === 'artigo' ? 'Artigo' : 'Doação';

                const cardHTML = `
                    <a href="modelpost.html?id=${post.id}" class="guia-post-link">
                        <div class="guia-post-card">
                            <div class="guia-post-info">
                                <span class="tag-tipo ${tagClasse}">${tagTexto}</span>
                                <h3 class="guia-post-titulo">${post.titulo}</h3>
                                <p class="guia-post-previa">${post.conteudo.substring(0, 100)}...</p>
                            </div>
                            <div class="guia-post-seta">➔</div>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
