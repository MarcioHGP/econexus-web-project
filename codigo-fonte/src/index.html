<!DOCTYPE html>
<!-- Esta é uma página padrão apenas para a criação de uma estrutura-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bernardo">
    <title>Econexus Home</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        *
        {
            margin: 0;
            padding: 0;
        }

        body
        {
            font-family: "Inter", Arial, Helvetica, sans-serif;
        }

        main
        {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        h1
        {
            margin: 10px;
            padding: 20px 15px;
        }
        
        .eco
        {
            color:darkgreen;
        }

        .nexus
        {
            color:darkblue;
        }

        img
        {
            height: 30vh;
            width: 30vh;
            padding: 30px 15px;
        }

        footer
        {
            display: flex;
            justify-content: center;

            width: 100%;
            padding: 30px 15px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    
    <main>
        <h1>
            Olá! Esta página estará pronta em breve. 
        </h1>

        <h2>
            <span class="eco">Eco</span><span class="nexus">Nexus</span>
        </h2>

        <img src="https://i.ibb.co/PZc9R4Fz/loading.gif" alt="Gif de carregamento" draggable="false" oncontextmenu="return false;">
    </main>

    <footer>
        <p>Econexus <span id="ano"></span>&copy; Todos os direitos reservados.</p>
    </footer>
    

    <script>
        document.getElementById("ano").innerHTML = new Date().getFullYear();
    </script>
</body>
</html>
