<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econexus - Login</title>
    <link rel="icon" type="image/x-icon" href="eco_favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <main>
        <nav class="navbar navbar-black bg-black">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="econexus_logo.png" alt="Logo Econexus" style="height: 40px;">
                </a>
            </div>
        </nav>

        <div class="login">
            <div class="login-container">
                <h2 class="text-center mb-4">Acessar Conta</h2>
                
                <form id="formLogin">
                    <label class="d-block text-center mb-2">Entrar como:</label>
                    <div class="btn-group-toggle mb-4" role="group">
                        <input type="radio" class="btn-check" name="tipoLogin" id="tipoCidadao" value="cidadao" checked>
                        <label class="btn btn-outline-success w-100" for="tipoCidadao">Cidadão</label>

                        <input type="radio" class="btn-check" name="tipoLogin" id="tipoCooperativa" value="cooperativa">
                        <label class="btn btn-outline-success w-100" for="tipoCooperativa">Cooperativa</label>
                    </div>

                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                    
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                    
                    <button type="submit">Entrar</button>
                </form>

                <div class="link">
                    Novo por aqui? <a href="cadastro.html">Cadastre-se.</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Econexus. Todos os direitos reservados.</p>
        </div>
    </footer>

<script src="app.js"></script>
</body>
</html>
