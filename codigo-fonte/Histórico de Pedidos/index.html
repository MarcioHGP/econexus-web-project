<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econexus - Histórico de Descartes</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar bg-black border-bottom border-success">
        <div class="container-fluid">
            <label for="menu-toggle" class="hamburger-label">
                <svg fill="white" width="30" viewBox="0 0 14 14"><path d="M2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/></svg>
            </label>
            <input type="checkbox" id="menu-toggle">
            
            <div class="full-screen-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html" class="nav-link">Histórico</a>
                <a href="index.html" class="nav-link">Sair</a>
            </div>

            <span class="navbar-brand mb-0 h1 texto-verde">EcoNexus</span>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="mb-4">Olá, Márcio! Veja seu impacto:</h2>

        <div class="row mb-5">
            <div class="col-md-4 mb-3">
                <div class="card-impacto text-center">
                    <h3 class="texto-verde">15kg</h3>
                    <p class="mb-0">Resíduos Reciclados</p>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card-impacto text-center">
                    <h3 class="texto-verde">120L</h3>
                    <p class="mb-0">Água Economizada</p>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card-impacto text-center">
                    <h3 class="texto-verde">2</h3>
                    <p class="mb-0">Árvores Preservadas</p>
                </div>
            </div>
        </div>

        <h4 class="mb-3">Últimos Descartes</h4>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Data</th>
                        <th>Material</th>
                        <th>Peso (kg)</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-descartes">
                    </tbody>
            </table>
        </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto border-top border-success">
        <p class="m-0">&copy; 2026 Econexus. Todos os direitos reservados.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
