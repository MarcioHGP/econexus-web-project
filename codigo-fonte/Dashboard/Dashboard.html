<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econexus - Dashboard Filtros</title>
    <link rel="icon" type="image/x-icon" href="eco_favicon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="style.css" rel="stylesheet">
   
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar bg-black py-3">
            <div class="container">
                <label for="menu-toggle" class="hamburger-label">
                    <svg fill="white" width="30" viewBox="0 0 14 14"><path d="M2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/></svg>
                </label>
                <a class="navbar-brand m-0" href="index.html"><img src="eco_favicon.png" alt="Logo" class="logo-img"></a>
                <a href="#" class="user-link" id="navUserName">Usuário</a>
                <input type="checkbox" id="menu-toggle">
                <div class="full-screen-menu">
                    <ul class="nav flex-column text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                        <li class="nav-item"><a class="nav-link" href="pontos.html">Pontos de Coleta</a></li>
                        <li class="nav-item"><a class="nav-link" href="configuracoes.html">Configurações</a></li>
                        <li class="nav-item mt-5"><label for="menu-toggle" class="btn btn-outline-light rounded-pill px-4">Fechar</label></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold">EcoMapa Belo Horizonte</h2>
            <p class="text-secondary">Explore mais de 70 pontos de coleta seletiva na capital.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="search-section mb-5">
                    <div class="row mb-4">
                        <div class="col-md-12">
                            <label class="form-label fw-bold text-secondary small">BUSCAR POR BAIRRO OU ENDEREÇO:</label>
                            <input type="text" id="filtro-texto" class="form-control form-control-lg rounded-pill" placeholder="Ex: Savassi, Centro, Rua Sapucaí...">
                        </div>
                    </div>

                    <label class="form-label fw-bold text-secondary small mb-3">FILTRAR POR MATERIAL:</label>
                    <div class="d-flex flex-wrap gap-2 mb-4">
                        <div class="material-item ativo" onclick="selecionarMaterial('', this)">
                            <span>Todos</span>
                        </div>
                        <div class="material-item" onclick="selecionarMaterial('Papel', this)">
                            <span>Papel</span>
                        </div>
                        <div class="material-item" onclick="selecionarMaterial('Plástico', this)">
                            <span>Plástico</span>
                        </div>
                        <div class="material-item" onclick="selecionarMaterial('Vidro', this)">
                            <span>Vidro</span>
                        </div>
                        <div class="material-item" onclick="selecionarMaterial('Metal', this)">
                            <span>Metal</span>
                        </div>
                    </div>

                    <button class="btn-busca shadow-sm" onclick="buscarPontos()">
                        <i class="bi bi-search me-2"></i>Atualizar Resultados
                    </button>
                </div>

                <div id="resultado-count"></div>
                <div id="resultado" class="row g-4">
                    </div>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="m-0 opacity-75">&copy; 2026 Econexus. BH mais sustentável.</p>
        </div>
    </footer>
    
<script src="app.js"></script>
    
</body>
</html>
