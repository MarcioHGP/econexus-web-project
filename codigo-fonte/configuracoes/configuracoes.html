<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Econexus - Configurações</title>
    <link rel="icon" type="image/x-icon" href="eco_favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">

</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar bg-black py-3">
            <div class="container">
                <label for="menu-toggle" class="hamburger-label">
                    <svg fill="white" viewBox="0 0 14 14"><path d="M2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/></svg>
                </label>
                
                <a class="navbar-brand m-0" href="index.html">
                    <img src="econexus_logo.png" alt="Logo Econexus" class="logo-img">
                </a>

                <a href="#" class="user-link" id="navUserName">Usuário</a>

                <input type="checkbox" id="menu-toggle">

                <div class="full-screen-menu">
                    <ul class="nav flex-column text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
                        <li class="nav-item"><a class="nav-link" href="pontos.html">Pontos de Coleta</a></li>
                        <li class="nav-item"><a class="nav-link" href="configuracoes.html">Configurações</a></li>
                        <li class="nav-item mt-5">
                            <label for="menu-toggle" class="btn btn-outline-light rounded-pill px-4">Fechar Menu</label>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="text-center mb-5">
                <h1 class="fw-bold" style="color: var(--preto-eco);">Configurações</h1>
                <p class="text-secondary">Gerencie seus dados e preferências da conta.</p>
            </div>

            <div class="config-container">
                <button class="btn-config" onclick="abrirModal('pessoal')">
                    <span><i class="bi bi-person-circle me-3"></i>Informações Pessoais</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config" onclick="abrirModal('endereco')">
                    <span><i class="bi bi-geo-alt-fill me-3"></i>Meu Endereço</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config" onclick="abrirModal('notificacoes')">
                    <span><i class="bi bi-bell-fill me-3"></i>Notificações</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config" onclick="alert('Suporte Econexus: suporte@econexus.com')">
                    <span><i class="bi bi-headset me-3"></i>Suporte e Ajuda</span>
                    <i class="bi bi-chevron-right"></i>
                </button>

                <button class="btn-config btn-logout" onclick="logout()">
                    <span><i class="bi bi-box-arrow-right me-3"></i>Sair da Conta</span>
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="m-0 opacity-75">&copy; 2026 Econexus. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- Overlay de Modais -->
    <div id="modalOverlay" class="overlay">
        <div class="overlay-card">
            <span class="btn-close-modal" onclick="fecharModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
